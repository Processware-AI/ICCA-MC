# 개발용 오버라이드 — docker compose가 이 파일을 자동으로 읽어 docker-compose.yml에 덧씌운다.
#
# 정적 파일과 서버 소스를 호스트에서 직접 마운트하므로 재빌드 없이 수정이 반영된다.
#   - HTML/CSS/JS/이미지 : 파일 저장 후 브라우저 새로고침이면 끝
#   - server/*.js        : node --watch가 감지해 자동 재시작
#                          (Windows 바인드 마운트에서는 파일 변경 이벤트가 전달되지 않는 경우가 있다.
#                           반영되지 않으면 `docker compose restart web`)
#
# 배포 시에는 이 파일을 적용하지 않는다:
#   docker compose -f docker-compose.yml up -d --build

services:
  web:
    volumes:
      # :ro — 컨테이너가 소스를 수정하지 못하게 읽기 전용으로 마운트
      - ./index.html:/app/index.html:ro
      - ./pages:/app/pages:ro
      - ./css:/app/css:ro
      - ./js:/app/js:ro
      - ./images:/app/images:ro
      - ./server:/app/server:ro

    command: ["node", "--watch", "--disable-warning=ExperimentalWarning", "server/index.js"]
